<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>otter-merge</title>
  <link rel="icon" href="{{ url_for('static', filename='logo/logo.png') }}">
  <style>
    :root {
      --bg: #010101; --card: #1c1c1c; --ink: #f9fefd; --muted: rgba(249, 254, 253, 0.7);
      --line: #06481d; --accent: #23e87a; --accent-hover: #3dc273; --accent-ink: #010101;
      --tint: rgba(6, 72, 29, 0.35); --bad: #ff7b72; --ok: #3dc273;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
    .head { display: flex; gap: 14px; align-items: center; margin-bottom: 24px; }
    .logo { width: 48px; height: 48px; border-radius: 10px; object-fit: contain; }
    h1 { margin: 0; font-size: 1.5rem; }
    .sub { margin: 2px 0 0; color: var(--muted); }
    .drop { position: relative; display: flex; flex-direction: column; gap: 2px; align-items: center; padding: 28px 16px; text-align: center; background: var(--card); border: 2px dashed var(--line); border-radius: 12px; cursor: pointer; transition: border-color .15s, background-color .15s; }
    .drop:hover, .drop.over, .drop:focus-within { border-color: var(--accent); background: var(--tint); }
    .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .drop span { color: var(--muted); font-size: .9rem; }
    .list { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
    .item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
    .item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .meta { display: block; font-size: .8rem; color: var(--muted); }
    .item.error .meta, .item.expired .meta { color: var(--bad); }
    .item.expired { border-color: rgba(255, 123, 114, 0.55); }
    .item.done .meta { color: var(--ok); }
    .item button { width: 32px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); cursor: pointer; font-size: 1rem; flex-shrink: 0; }
    .item button.reupload { width: auto; padding: 0 10px; font-size: .85rem; font-weight: 600; border-color: rgba(255, 123, 114, 0.6); color: var(--bad); }
    .item button:hover:not(:disabled) { border-color: var(--accent); background: var(--tint); color: var(--ink); }
    .item button:disabled { opacity: .35; cursor: default; }
    .prompt { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding: 10px 12px; background: rgba(255, 123, 114, 0.1); border: 1px solid rgba(255, 123, 114, 0.45); border-radius: 10px; font-size: .9rem; }
    .prompt[hidden] { display: none; }
    .prompt button { padding: 6px 12px; border: 1px solid rgba(255, 123, 114, 0.6); border-radius: 8px; background: transparent; color: var(--bad); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .prompt button:hover:not(:disabled) { border-color: var(--accent); color: var(--ink); background: var(--tint); }
    .prompt button:disabled { opacity: .45; cursor: not-allowed; }
    .empty { color: var(--muted); text-align: center; margin: 16px 0 0; }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    #merge, .download { padding: 10px 20px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; transition: background-color .15s; }
    #merge:hover:not(:disabled), .download:hover { background: var(--accent-hover); }
    #merge:disabled { opacity: .45; cursor: not-allowed; }
    .ghost { padding: 10px 16px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
    .ghost:hover:not(:disabled) { border-color: var(--accent-hover); background: var(--tint); }
    .ghost:disabled { opacity: .45; cursor: not-allowed; }
    .status { min-height: 1.5em; color: var(--muted); }
    .status.error { color: var(--bad); }
    .download[hidden], .empty[hidden] { display: none; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="head">
      <img class="logo" src="{{ url_for('static', filename='logo/logo.png') }}" alt="Logo" onerror="this.style.display='none'">
      <div>
        <h1>otter-merge</h1>
        <p class="sub">Add PDFs, set the order, and download one file.</p>
      </div>
    </header>

    <label class="drop" id="drop" for="picker">
      <input id="picker" type="file" accept="application/pdf,.pdf" multiple>
      <strong>Choose PDF files</strong>
      <span>Up to 10 files, 4MB each</span>
    </label>

    <ul id="list" class="list" aria-live="polite"></ul>
    <p id="empty" class="empty">No files yet. Choose PDFs to get started.</p>
    <div id="expired-prompt" class="prompt" role="alert" hidden>
      <span id="expired-msg"></span>
      <button id="reupload-all" type="button">Re-upload expired</button>
    </div>

    <div class="actions">
      <button id="merge" type="button" disabled>Merge PDFs</button>
      <button id="clear" type="button" class="ghost" disabled>Clear all</button>
    </div>

    <p id="status" class="status" role="status"><span id="status-text"></span><span id="countdown" aria-live="off"></span></p>
    <a id="download" class="download" hidden>Download merged PDF</a>
  </main>
  <script>
    (() => {
      const MAX_FILES = 10, MAX_BYTES = 4 * 1024 * 1024;
      const UPLOAD_TTL_MS = ({{ upload_ttl|default(3600)|tojson }}) * 1000;
      const $ = (id) => document.getElementById(id);
      const picker = $("picker"), list = $("list"), empty = $("empty"),
            mergeBtn = $("merge"), clearBtn = $("clear"), statusEl = $("status"),
            statusText = $("status-text"), countdownEl = $("countdown"),
            expiredPrompt = $("expired-prompt"), expiredMsg = $("expired-msg"),
            reuploadAllBtn = $("reupload-all"), dl = $("download"), drop = $("drop");

      let items = []; // {file, state: queued|uploading|done|error|expired, id, pages, error, uploadedAt, expiresAt}
      let uploading = false, merging = false, currentController = null;
      let downloadExpiresAt = null, ttlTimer = null;

      const fmt = (n) => (n < 1024 * 1024 ? (n / 1024).toFixed(0) + " KB" : (n / 1024 / 1024).toFixed(1) + " MB");
      const fmtClock = (ms) => {
        const s = Math.max(0, Math.ceil(ms / 1000));
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      };
      const fmtTime = (ts) => new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      const fmtItemMeta = (it, now = Date.now()) => {
        if (it.state === "done") {
          const leftMin = Math.max(1, Math.ceil((it.expiresAt - now) / 60000));
          return `${it.pages} page${it.pages === 1 ? "" : "s"} · ${fmt(it.file.size)} · uploaded ${fmtTime(it.uploadedAt)} (${leftMin}m left)`;
        }
        if (it.state === "expired") return `Expired after 1 hour (uploaded ${fmtTime(it.uploadedAt)}) · Re-upload to include`;
        if (it.state === "uploading") return "Uploading…";
        if (it.state === "queued") return "Waiting…";
        return it.error;
      };
      const setStatus = (msg, err = false, countdown = "") => {
        statusText.textContent = msg;
        countdownEl.textContent = countdown;
        statusEl.classList.toggle("error", err);
      };
      const resetResult = () => {
        downloadExpiresAt = null;
        dl.hidden = true;
        dl.removeAttribute("href");
        delete dl.dataset.expired;
        countdownEl.textContent = "";
      };

      function syncTimer() {
        const active = downloadExpiresAt !== null || items.some((x) => x.state === "done" && x.expiresAt);
        if (active && !ttlTimer) ttlTimer = setInterval(checkExpirations, 1000);
        else if (!active && ttlTimer) { clearInterval(ttlTimer); ttlTimer = null; }
      }

      function checkExpirations() {
        const now = Date.now();
        let itemExpired = false;
        for (const it of items) {
          if (it.state === "done" && it.expiresAt && now >= it.expiresAt) {
            it.state = "expired";
            it.id = null;
            itemExpired = true;
          } else if (it.state === "done" && it._metaEl) {
            const nextMeta = fmtItemMeta(it, now);
            if (it._metaEl.textContent !== nextMeta) it._metaEl.textContent = nextMeta;
          }
        }
        if (downloadExpiresAt !== null) {
          const left = downloadExpiresAt - now;
          if (left <= 0) {
            downloadExpiresAt = null;
            dl.hidden = true;
            dl.removeAttribute("href");
            dl.dataset.expired = "true";
            const hasExpiredItems = items.some((x) => x.state === "expired");
            setStatus(
              hasExpiredItems
                ? "Download link expired. Re-upload expired files and merge again."
                : "Download link expired. Click Merge PDFs to generate a new link.",
              true
            );
          } else {
            countdownEl.textContent = ` (${fmtClock(left)} left)`;
          }
        }
        if (itemExpired) render();
        syncTimer();
      }

      function requeueItems(targets) {
        let changed = false;
        for (const it of targets) {
          if (it && it.state === "expired") {
            it.state = "queued";
            it.id = null;
            it.error = null;
            it.uploadedAt = null;
            it.expiresAt = null;
            changed = true;
          }
        }
        if (!changed) return;
        resetResult();
        setStatus("");
        render();
        uploadQueue();
      }

      function render() {
        const now = Date.now();
        list.textContent = "";
        items.forEach((it, i) => {
          const li = document.createElement("li");
          li.className = "item " + (it.state === "error" ? "error" : it.state === "expired" ? "expired" : it.state === "done" ? "done" : "");
          const text = document.createElement("div");
          text.className = "name";
          text.textContent = it.file.name;
          const meta = document.createElement("span");
          meta.className = "meta";
          meta.textContent = fmtItemMeta(it, now);
          it._metaEl = meta;
          text.appendChild(meta);
          li.appendChild(text);

          const mk = (label, aria, onClick, disabled, cls = "") => {
            const b = document.createElement("button");
            b.type = "button"; b.textContent = label; b.setAttribute("aria-label", aria);
            if (cls) b.className = cls;
            b.disabled = disabled || merging; b.addEventListener("click", onClick);
            return b;
          };
          if (it.state === "expired") {
            li.appendChild(mk("Re-upload", `Re-upload ${it.file.name}`, () => requeueItems([it]), false, "reupload"));
          }
          li.appendChild(mk("↑", `Move ${it.file.name} up`, () => move(i, -1), i === 0));
          li.appendChild(mk("↓", `Move ${it.file.name} down`, () => move(i, 1), i === items.length - 1));
          li.appendChild(mk("✕", `Remove ${it.file.name}`, () => removeItem(i), false));
          list.appendChild(li);
        });
        const ready = items.filter((x) => x.state === "done").length;
        const expiredCount = items.filter((x) => x.state === "expired").length;
        empty.hidden = items.length > 0;
        expiredPrompt.hidden = expiredCount === 0;
        if (expiredCount > 0) {
          expiredMsg.textContent = expiredCount === 1
            ? "1 uploaded file expired after 1 hour."
            : `${expiredCount} uploaded files expired after 1 hour.`;
        }
        reuploadAllBtn.disabled = merging || expiredCount === 0;
        mergeBtn.disabled = merging || uploading || ready < 2;
        clearBtn.disabled = merging || items.length === 0;
        syncTimer();
      }

      function move(i, d) {
        const j = i + d;
        if (j < 0 || j >= items.length) return;
        [items[i], items[j]] = [items[j], items[i]];
        resetResult(); render();
      }

      function removeItem(i) {
        const [removed] = items.splice(i, 1);
        if (removed && removed.state === "uploading" && currentController) {
          currentController.abort();
        }
        resetResult(); render();
      }

      async function readError(res) {
        try { return (await res.json()).error || `Request failed (${res.status}).`; }
        catch { return `Request failed (${res.status}).`; }
      }

      async function uploadQueue() {
        if (uploading) return;
        uploading = true;
        try {
          while (true) {
            const it = items.find((x) => x.state === "queued");
            if (!it) break;
            it.state = "uploading";
            render();
            currentController = new AbortController();
            try {
              const fd = new FormData();
              fd.append("file", it.file, it.file.name);
              const res = await fetch("/api/upload", {
                method: "POST",
                body: fd,
                signal: currentController.signal,
              });
              if (!res.ok) throw new Error(await readError(res));
              const data = await res.json();
              const ttlMs = Number(data.expires_in) > 0 ? Number(data.expires_in) * 1000 : UPLOAD_TTL_MS;
              it.id = data.file_id;
              it.pages = data.pages;
              it.uploadedAt = Date.now();
              it.expiresAt = it.uploadedAt + ttlMs;
              it.state = "done";
            } catch (e) {
              if (e.name !== "AbortError") {
                it.state = "error";
                it.error = e.message || "Upload failed.";
              }
            } finally {
              currentController = null;
            }
            render();
          }
        } finally {
          uploading = false;
          render();
        }
      }

      function addFiles(files) {
        resetResult(); setStatus("");
        for (const file of files) {
          if (items.length >= MAX_FILES) { setStatus(`You can merge up to ${MAX_FILES} files.`, true); break; }
          const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
          const it = { file, state: "queued" };
          if (!isPdf) { it.state = "error"; it.error = "Not a PDF file."; }
          else if (file.size > MAX_BYTES) { it.state = "error"; it.error = `Larger than 4MB (${fmt(file.size)}).`; }
          items.push(it);
        }
        render(); uploadQueue();
      }

      picker.addEventListener("change", () => { addFiles(Array.from(picker.files)); picker.value = ""; });
      ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
      ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
      drop.addEventListener("drop", (e) => addFiles(Array.from(e.dataTransfer.files)));
      reuploadAllBtn.addEventListener("click", () => requeueItems(items));

      clearBtn.addEventListener("click", () => {
        items = [];
        if (currentController) currentController.abort();
        resetResult(); setStatus(""); render();
      });

      mergeBtn.addEventListener("click", async () => {
        checkExpirations();
        // Files that failed or expired are skipped; the rest merge in list order.
        const ids = items.filter((x) => x.state === "done").map((x) => x.id);
        if (ids.length < 2) {
          setStatus("At least 2 non-expired PDFs are required to merge.", true);
          return;
        }
        merging = true; resetResult(); setStatus("Merging…"); render();
        try {
          const res = await fetch("/api/merge", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ file_ids: ids }),
          });
          if (!res.ok) throw new Error(await readError(res));
          const data = await res.json();
          const ttlMs = (Number(data.expires_in) > 0 ? Number(data.expires_in) : 900) * 1000;
          downloadExpiresAt = Date.now() + ttlMs;
          dl.href = data.download_url; dl.hidden = false; delete dl.dataset.expired;
          setStatus(
            `Merged ${data.pages ?? ""} pages. This link expires in ${Math.round(ttlMs / 60000)} minutes.`,
            false,
            ` (${fmtClock(ttlMs)} left)`
          );
          syncTimer();
        } catch (e) {
          setStatus(e.message || "Merge failed.", true);
        } finally {
          merging = false; render();
        }
      });

      document.addEventListener("visibilitychange", () => { if (!document.hidden) checkExpirations(); });
      window.addEventListener("focus", checkExpirations);

      render();
    })();
  </script>
</body>
</html>
