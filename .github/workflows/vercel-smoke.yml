name: Vercel Post-Deploy Smoke Test

on:
  deployment_status:

jobs:
  smoke-test:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.target_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Probe deployed endpoints
        env:
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          python3 - <<'EOF'
          import json, os, time, urllib.request

          base = os.environ["TARGET_URL"].rstrip("/")

          def check(path, expect_text=None, expect_json_ok=False):
              url = f"{base}{path}"
              req = urllib.request.Request(url, headers={"User-Agent": "otter-merge-ci-smoke"})
              with urllib.request.urlopen(req, timeout=15) as res:
                  assert res.status == 200, f"{url} returned {res.status}"
                  body = res.read()
                  if expect_text:
                      assert expect_text in body.decode("utf-8", errors="ignore"), f"{expect_text} missing at {url}"
                  if expect_json_ok:
                      assert json.loads(body).get("ok") is True, f"Unexpected healthz payload at {url}"

          last_err = None
          for attempt in range(1, 6):
              try:
                  check("/", expect_text="otter-merge")
                  check("/healthz", expect_json_ok=True)
                  check("/static/logo/logo.png")
                  print(f"Smoke test passed for {base} on attempt {attempt}")
                  raise SystemExit(0)
              except Exception as exc:
                  last_err = exc
                  print(f"Attempt {attempt} failed: {exc}")
                  time.sleep(5)
          raise SystemExit(f"Smoke test failed for {base}: {last_err}")
          EOF
