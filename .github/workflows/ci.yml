name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-frontend:
    name: Lint & Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_frontend.py

  unit-tests:
    name: Unit Tests & Smoke Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile app.py
      - run: python -m pytest -m "not integration" -v

  schema-postgres:
    name: Schema Idempotency & Migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: otter
          POSTGRES_PASSWORD: otter_password
          POSTGRES_DB: otter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run Postgres schema tests
        env:
          CI_POSTGRES_URL: postgresql://otter:otter_password@localhost:5432/otter_test
        run: python -m pytest tests/test_schema_postgres.py -v

  integration-e2e:
    name: E2E Integration (Postgres + Redis + S3)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: otter
          POSTGRES_PASSWORD: otter_password
          POSTGRES_DB: otter_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt "moto[server]>=5.0"
      - name: Start Moto S3 server and create test bucket
        env:
          AWS_ENDPOINT_URL_S3: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          AWS_BUCKET: otter
        run: |
          nohup moto_server -H 127.0.0.1 -p 9000 >/tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/moto-api/ >/dev/null; then
              break
            fi
            sleep 1
          done
          python - <<'EOF'
          import os, boto3
          from botocore.config import Config
          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["AWS_ENDPOINT_URL_S3"],
              aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"],
              region_name=os.environ["AWS_REGION"],
              config=Config(s3={"addressing_style": "path"}, signature_version="s3v4"),
          )
          s3.create_bucket(Bucket=os.environ["AWS_BUCKET"])
          EOF
      - name: Run E2E container tests
        env:
          CI_E2E: "1"
          DATABASE_URL: postgresql://otter:otter_password@localhost:5432/otter_e2e
          LAYERBASE_URL: redis://localhost:6379/0
          AWS_ENDPOINT_URL_S3: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          AWS_BUCKET: otter
          CRON_SECRET: ci-test-cron-secret
        run: python -m pytest tests/test_e2e_containers.py -v
